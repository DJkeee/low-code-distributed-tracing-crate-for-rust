x-rust-service: &rust-service
  image: rust:1-bookworm
  working_dir: /app
  volumes:
    - ..:/app
  environment:
    OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    RUST_LOG: info
  depends_on:
    - otel-collector

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  risk-engine:
    <<: *rust-service
    command: cargo run -p risk-engine
    environment:
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      RUST_LOG: info
      RISK_ENGINE_BIND: 0.0.0.0:3003
    ports:
      - "3003:3003"

  order-processor:
    <<: *rust-service
    command: cargo run -p order-processor
    environment:
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      RUST_LOG: info
      ORDER_PROCESSOR_BIND: 0.0.0.0:3001
      RISK_ENGINE_URL: http://risk-engine:3003
    ports:
      - "3001:3001"
    depends_on:
      - otel-collector
      - risk-engine

  checkout-api:
    <<: *rust-service
    command: cargo run -p checkout-api
    environment:
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      RUST_LOG: info
      CHECKOUT_API_BIND: 0.0.0.0:3000
      ORDER_PROCESSOR_URL: http://order-processor:3001
      RISK_ENGINE_URL: http://risk-engine:3003
    ports:
      - "3000:3000"
    depends_on:
      - otel-collector
      - order-processor
      - risk-engine

  demo-ui:
    <<: *rust-service
    command: cargo run -p demo-ui
    environment:
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      RUST_LOG: info
      DEMO_UI_BIND: 0.0.0.0:3002
      CHECKOUT_API_URL: http://checkout-api:3000
      ORDER_PROCESSOR_URL: http://order-processor:3001
      RISK_ENGINE_URL: http://risk-engine:3003
      JAEGER_URL: http://jaeger:16686
    ports:
      - "3002:3002"
    depends_on:
      - jaeger
      - otel-collector
      - checkout-api
      - order-processor
      - risk-engine
