[workspace]
members = [
    "crates/my-infra-otel",
    "examples/service-a",
    "examples/service-b",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8.9"
http = "1"
http-body = "1"
opentelemetry = "0.26"
opentelemetry-otlp = { version = "0.26", default-features = false, features = ["http-proto", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "net"] }
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = "0.27"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
